name: CI evidence tools

on:
  pull_request:
    paths:
      - '.github/workflows/atlas-ci-tools.yml'
      - 'scripts/atlas_ci_*.py'
      - 'tests/test_atlas_ci_*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-ci-tools.yml'
      - 'scripts/atlas_ci_*.py'
      - 'tests/test_atlas_ci_*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-evidence-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline evidence regressions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record runner admission
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'ATLAS_CI_TOOLS_RUNNER_ADMITTED'
          python3 --version

      - name: Check out only CI tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /LICENSE
            /scripts/atlas_ci_admission.py
            /scripts/atlas_ci_required_coverage.py
            /tests/test_atlas_ci_admission.py
            /tests/test_atlas_ci_integration.py
            /tests/test_atlas_ci_observation_contract.py
            /tests/test_atlas_ci_required_coverage.py

      - name: Run offline regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_atlas_ci_*.py' -v

      - name: Verify optimized Python behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -O -m unittest discover -s tests -p 'test_atlas_ci_*.py' -v
