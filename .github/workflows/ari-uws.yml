name: ATLAS ARI UWS Gateway Tests
on:
  pull_request:
    paths:
      - 'integrations/**'
      - 'server.ts'
      - '.github/workflows/ari-uws.yml'
  push:
    branches:
      - 'feature/ari-uws-full-capability-20261011'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-tool-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python compile
        run: python3 -m compileall -q integrations
      - name: Test UWS agent without external provider traffic
        run: python3 -m unittest discover -s integrations/tests -v
