name: Bug report
description: Report a reproducible problem in a current component.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Use synthetic examples; do not paste credentials or private corpus content."
  - type: input
    id: component
    attributes:
      label: Component and source revision
      description: Name the affected component and commit or branch.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest commands or steps that demonstrate the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Checks and evidence
      description: Include relevant sanitized output, runtime versions, and related issues or PRs.
