[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-work-learning"
version = "0.1.0"
description = "Source-addressed private work learning with Ariadne, OpenAI tools and optional adapters"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
atlas-work-learning = "atlas_work_learning.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

